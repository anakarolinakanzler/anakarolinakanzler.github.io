<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ImobiWeb - Cadastro de Imóveis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Barra de navegação */
        nav {
            background-color: #2c3e50;
            padding: 15px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Pseudo-classe */
        nav ul li a:hover {
            color: #f1c40f;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        img {
            width: 350px;
            border-radius: 8px;
            margin-top: 15px;
        }

        form {
            max-width: 400px;
            margin: 20px auto;
            text-align: left;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Pseudo-classes */
        button:hover {
            background-color: #34495e;
        }

        input:focus {
            outline: 2px solid #f1c40f;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Imóveis</a></li>
            <li><a href="#">Cadastrar</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <main>
        <h1>Cadastro de Imóveis</h1>
        <p>Cadastre seu imóvel de forma rápida e simples.</p>
        
        <img src="https://images.pexels.com/photos/8470800/pexels-photo-8470800.jpeg" alt="Chaves de imóvel sendo entregues">

        <form>
            <label for="titulo">Título do imóvel</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Casa com piscina">

            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" placeholder="R$">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade">

            <button type="submit">Cadastrar Imóvel</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 - ImobiWeb. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
